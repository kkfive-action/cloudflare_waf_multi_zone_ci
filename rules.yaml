rules:
# 第零優先：放行你自己信任的基礎設施（最高優先，跳過後面所有 custom rules + 受管產品）。
# 白名單只認可驗證依據，UA 一律不作為信任依據：
#   1. $trusted_infrastructure —— 帳戶級 IP list（server / CI / 監控出口 IP）。
#      免費帳戶只有 1 個 list 額度且只能是 IP 類型，所有白名單 IP 都放這裡。
#   2. 專用域名（可選）—— 給監控服務開的專用 host（如 status.example.com 指向同一源站），
#      直接在下面 expression 內聯 or (http.host eq "status.example.com")，不佔 list 額度。
# 注意：list 是帳戶級資源、不在 Terraform 管理內——改名或刪除會讓 CI 的 apply 失敗。
- action: skip
  name: Allow Trusted Infrastructure
  expression: (ip.src in $trusted_infrastructure)
  skip_current_ruleset: true
  products:
  - waf
  - bic
  - rateLimit
  - securityLevel
  - uaBlock
  - zoneLockdown
  logging_enabled: true

# 第一優先：放行常見合法服務（只跳過受管產品，後面的 custom block 仍會評估！）。
# 絕不能給這條加 skip_current_ruleset——掃描器會在 GCP 上偽造 Googlebot UA
# （ASN 也真的是 Google），若連 custom rules 也跳過，/__vite、.env 等攔截全部失效
# （2026-10 真實事件：34.85.27.89 偽造 Googlebot 探測 /__vite_rsc_findSourceMapURL）。
# 搜索引擎不再用 UA+ASN 自验：GCP/Azure 客戶 VM 與搜索引擎共用 ASN
# （AS15169/396982 = 全體 GCP 客戶、AS8075 = 全體 Azure 客戶），ASN 條件對
# 偽造者零門檻——2026-10 事件（34.85.27.89 偽造 Googlebot）正是鑽這個空子。
# cf.client.bot 由 Cloudflare 用 IP 反向驗證、不可偽造，已涵蓋真 Googlebot/Bingbot。
# 社交預覽 bot 改配各自營 ASN（不與公有云客戶混用，驗證有效）：Meta 32934、
# Twitter/X 13414、LinkedIn 14413、Apple 714。Discord 無穩定公開 ASN，維持 UA 判斷
# （殘留風險：UA 可偽造跳過受管產品，但後面 custom block 仍生效）。
- action: skip
  expression: (cf.client.bot) or ((http.user_agent contains "facebookexternalhit") and (ip.src.asnum eq 32934)) or ((http.user_agent contains "Twitterbot") and (ip.src.asnum eq 13414)) or ((http.user_agent contains "LinkedInBot") and (ip.src.asnum eq 14413)) or ((http.user_agent contains "AppleBot") and (ip.src.asnum eq 714)) or (http.user_agent contains "Discordbot")
  name: Allow Essential Legitimate Services
  products:
  - waf
  - bic
  - rateLimit

# 第二優先：8cawecg8gu 專用防護——雙因子攔截。
# ① 非 GET/HEAD 方法一律 403；② GET/HEAD 但路徑不含秘密前綴也 403。
# 秘密前綴走 GitHub Secret（SECRET_PATH_PREFIX），rules.yaml 裡只是占位符；
# CI 運行時就地替換，倉庫裡永遠看不到明文。隨機子域名 + 不可見路徑秘密，雙保險。
# 注意：與下方通用防掃描規則合併會超過 CF 單條表達式節點數上限（實測 Filter
# parsing error），故保持獨立規則。
- action: block
  expression: (http.host eq "8cawecg8gu.kkfive.top") and (not (http.request.method in {"GET" "HEAD"}) or not (http.request.uri.path contains "${SECRET_PATH_PREFIX}"))
  name: Block Non-GET Methods on Secret Config Host

# 第三優先：擋惡意 ASN + 掃描工具 UA + 監控服務 UA + 漏洞路徑 + 死技術棧後綴 + 危險方法。
# （免費版 5 條額度限制，ASN block 與 exploit block 同為 block 動作，合併為一條；
#   開頭的 (ip.src.asnum in {...}) 條件由 update_abuseipdb_asns.py 每次就地重寫。）
# 監控服務 UA（UptimeRobot / Pingdom / StatusCake / Site24x7 / GTmetrix / WebPageTest）
# 全部直接 block——UA 可零成本偽造；自家真要用監控服務時，走上面的 IP / host 白名單。
# 本棧是 Go / JS/TS，所以 php / asp(x) / jsp / cgi 整族後綴都是死探測，直接 block。
# （若哪天技術棧變了、真的要用其中某種後綴，記得先從這條拿掉。）
# VCS 目錄（.git/.svn/.hg）、Vite dev server 指紋（/@fs/、/__vite）、框架調試端點
# （_profiler、debug/pprof、/console）、密鑰文件（.npmrc、key.pem、service-account.json、
# gcp-credentials.json）一併 block。
# 所有路徑 contains 都包 lower()：contains 大小寫敏感，不歸一的話 /.GIT、/.Env、
# /WP-LOGIN 直接繞過（與擴展名檢查的 lower() 保持一致；免費版無 matches 正則）。
# dot-file 檢查去掉前導 /（".env" 本身已涵蓋 "/.env"），省字符且覆蓋更全。
# 路徑穿越只查解碼後形態 "../"：http.request.uri.path 已被 CF percent-decode，
# 查 "..%2f"、"%2e%2e" 這種編碼字面量是永遠不命中的死代碼（raw_uri 是付費字段）。
# query 也檢查 .env：掃描器會把目標藏在 query 參數裡（如 ?filename=file:///app/.env）。
- action: block
  expression: (ip.src.asnum in {16276 24940 14061 9009}) or (http.user_agent contains "UptimeRobot") or (http.user_agent contains "Pingdom") or (http.user_agent contains "StatusCake") or (http.user_agent contains "Site24x7") or (http.user_agent contains "GTmetrix") or (http.user_agent contains "WebPageTest") or (http.user_agent contains "sqlmap") or (http.user_agent contains "nikto") or (http.user_agent contains "nmap") or (http.user_agent contains "masscan") or (http.user_agent contains "nuclei") or (http.user_agent eq "") or (ends_with(lower(http.request.uri.path), ".php")) or (ends_with(lower(http.request.uri.path), ".phtml")) or (ends_with(lower(http.request.uri.path), ".phar")) or (ends_with(lower(http.request.uri.path), ".asp")) or (ends_with(lower(http.request.uri.path), ".aspx")) or (ends_with(lower(http.request.uri.path), ".jsp")) or (ends_with(lower(http.request.uri.path), ".cgi")) or (http.request.method in {"TRACE" "TRACK" "CONNECT"}) or (lower(http.request.uri.path) contains ".git") or (lower(http.request.uri.path) contains ".svn") or (lower(http.request.uri.path) contains ".hg") or (lower(http.request.uri.path) contains ".env") or (lower(http.request.uri.path) contains "/@fs/") or (lower(http.request.uri.path) contains "/__vite") or (lower(http.request.uri.path) contains "/_profiler") or (lower(http.request.uri.path) contains "/debug/pprof") or (lower(http.request.uri.path) contains "/console") or (lower(http.request.uri.path) contains ".npmrc") or (lower(http.request.uri.path) contains "key.pem") or (lower(http.request.uri.path) contains "service-account.json") or (lower(http.request.uri.path) contains "gcp-credentials.json") or (http.request.uri.path contains "../") or (lower(http.request.uri.query) contains ".env") or (lower(http.request.uri.path) contains "/wp-login") or (lower(http.request.uri.path) contains "/phpmyadmin") or (lower(http.request.uri.path) contains ".aws") or (lower(http.request.uri.path) contains ".ssh")
  name: Block Malicious Traffic & Exploit Probes

# 第四優先（兜底）：高威脅分數的流量丟 managed challenge。
# 注意：別用「挑戰所有海外流量」那種寫法——對 SPA + API 的站，managed challenge 會卡死
# 前端的 XHR / preflight，等於把海外用戶整個擋掉。用 threat_score 比較安全。
- action: managed_challenge
  expression: (cf.threat_score gt 10)
  name: Challenge High Threat Score Traffic
